name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          name: "PocketCloud Release ${{ github.ref_name }}"
          tag_name: ${{ github.ref }}
          draft: false
          prerelease: false
          body_path: PROJECT_STATUS.md
          files: |
            dist-windows/PocketCloud-Setup-0.1.0.exe
            dist-windows/PocketCloud-0.1.0.msi
            dist-windows/PocketCloud.exe
            dist-linux/PocketCloud_0.1.0_amd64.deb
            dist-linux/PocketCloud-0.1.0-1.x86_64.rpm
